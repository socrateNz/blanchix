# À utiliser UNIQUEMENT si le VPS a déjà un Nginx installé directement dessus (hors Docker),
# occupant déjà les ports 80/443 pour un autre site — dans ce cas, les services "nginx"/
# "certbot" de docker-compose.yml ne sont pas utilisés (voir leur absence, remplacés par
# app.ports: "127.0.0.1:3010:3000"), et c'est ce Nginx hôte qui fait le reverse proxy.
#
# Installation (voir DEPLOY.md) :
#   sudo cp nginx/host/vps.blanchix.cm.conf /etc/nginx/sites-available/vps.blanchix.cm
#   sudo ln -s /etc/nginx/sites-available/vps.blanchix.cm /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d vps.blanchix.cm
# (certbot --nginx édite ce fichier automatiquement pour ajouter le bloc HTTPS — pas besoin de
# le faire à la main, contrairement à la version Docker de ce projet.)

server {
    listen 80;
    server_name vps.blanchix.cm;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
