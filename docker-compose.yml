# Nom de projet fixe : les volumes nommés ci-dessous deviennent "blanchix_<nom>" de façon
# prévisible, quel que soit le nom du dossier où le dépôt est cloné sur le VPS (sinon Docker
# Compose préfixe avec le nom du dossier courant, ce qui casse les commandes qui référencent
# un volume par son nom exact — voir DEPLOY.md, amorçage du certificat SSL).
name: blanchix

services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
    restart: unless-stopped
    env_file: .env
    environment:
      MONGODB_URI: mongodb://${MONGO_APP_USERNAME}:${MONGO_APP_PASSWORD}@mongo:27017/blanchix?authSource=blanchix
    # Publié uniquement sur 127.0.0.1 (pas 0.0.0.0) : le Nginx déjà installé sur l'hôte (pas
    # celui de Docker — voir nginx/host/) fait le reverse proxy vers ce port local. Jamais
    # accessible directement depuis l'extérieur du VPS.
    ports:
      - "127.0.0.1:3010:3000"
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:7
    restart: unless-stopped
    # Pas de "ports:" ici, volontairement — accessible uniquement depuis les autres conteneurs
    # sur le réseau Docker interne, jamais depuis l'extérieur du VPS (§14 du cahier des charges).
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
    volumes:
      - mongo_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  cron:
    build: ./cron
    restart: unless-stopped
    env_file: .env
    environment:
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
    volumes:
      - ./scripts/backup-mongo.sh:/scripts/backup-mongo.sh:ro
      - mongo_backups:/backups
    depends_on:
      mongo:
        condition: service_healthy
      app:
        condition: service_started

volumes:
  mongo_data:
  mongo_backups:
